name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Unit Tests (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Default profile: fast, broker-less unit tests only (Surefire). No Docker needed.
      - name: Build & verify
        run: ./mvnw -B -ntp verify

  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ubuntu-latest ships a running Docker engine, so Testcontainers spins up real
      # Kafka + Schema Registry and ClickHouse for the *IT tests (Failsafe, verify phase).
      - name: Verify with integration tests
        run: ./mvnw -B -ntp verify -Pintegration-tests
