# Event generator — produces Avro ClickEvents to Kafka.
# Defaults target a local `docker compose up` stack; override the two env vars to
# point at infra running elsewhere (e.g. inside the compose network).

server:
  port: 8089

spring:
  application:
    name: event-generator
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: "1"
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        auto.register.schemas: true
        # Throughput-oriented batching for a high-volume producer shared across the
        # emitter threads. Extra buffer headroom keeps sends from blocking under the
        # transient backpressure of a benchmark ramp.
        linger.ms: 20
        batch.size: 65536
        buffer.memory: 67108864
        compression.type: lz4

generator:
  eps: 200
  virtual-users: 500
  # Parallel producer threads; override with GENERATOR_EMITTER_THREADS for load tests.
  emitter-threads: 4
  topic: clickstream.events.raw
  ref-products-topic: ref.products
  late-event-ratio: 0.05
  late-event-max-delay-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
