# Analytics API — serving layer (SSE live streams + ClickHouse OLAP).
# Defaults target a local `docker compose up` stack; override the env vars to point at
# infra running elsewhere (e.g. inside the compose network).

server:
  port: 8091

spring:
  application:
    name: analytics-api
  # ClickHouse OLAP source (HTTP interface). Pooled by HikariCP.
  datasource:
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/analytics}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    username: ${CLICKHOUSE_USER:clickstream}
    password: ${CLICKHOUSE_PASSWORD:clickstream}
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
      pool-name: clickhouse-pool

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
